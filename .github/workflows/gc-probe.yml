name: GC timer probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: cmd
        run: |
          %WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe /nologo /out:g.exe test\probe\gctimer.cs
          g.exe > out.txt
          type out.txt
      - shell: bash
        run: echo "::notice title=GC timer on .NET Framework::$(cat out.txt)"
