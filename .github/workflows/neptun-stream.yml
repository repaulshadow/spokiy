name: NEPTUN stream probe

# Службова перевірка формату WebSocket-потоку NEPTUN.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          pip install --quiet websockets==12.0
          python3 - <<'EOF'
          import asyncio, json, time, websockets
          async def main():
              seen = {}
              t0 = time.time()
              async with websockets.connect("wss://neptun.in.ua/api/v1/stream", open_timeout=20,
                                            extra_headers={"User-Agent": "Trevoga/1.0 (+https://github.com/repaulshadow/spokiy)"}) as ws:
                  while time.time() - t0 < 75:
                      try:
                          raw = await asyncio.wait_for(ws.recv(), timeout=80)
                      except asyncio.TimeoutError:
                          break
                      try:
                          m = json.loads(raw)
                      except Exception:
                          print("::notice title=non-json::" + str(raw)[:300]); continue
                      typ = m.get("type")
                      seen[typ] = seen.get(typ, 0) + 1
                      if seen[typ] <= 2:
                          d = m.get("data")
                          info = {"keys": list(m.keys()), "ts": m.get("ts"), "data_type": type(d).__name__}
                          if isinstance(d, dict):
                              info["data_keys"] = list(d.keys())
                              for k in ("raions", "oblasts", "threats"):
                                  if isinstance(d.get(k), list):
                                      info[k + "_n"] = len(d[k])
                                      if d[k]: info[k + "_0"] = d[k][0]
                          elif isinstance(d, list):
                              info["len"] = len(d)
                              if d: info["first"] = d[0]
                          print(f"::notice title=type {typ} (+{time.time()-t0:.1f}s)::" + json.dumps(info, ensure_ascii=False)[:900])
              print("::notice title=summary::" + json.dumps(seen))
          asyncio.run(main())
          EOF
