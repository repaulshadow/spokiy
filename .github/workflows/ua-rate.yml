name: UkraineAlarm rate
on: workflow_dispatch
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UA_KEY: ${{ secrets.UKRAINEALARM_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - run: python3 test/ua_rate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: regions, path: regions.json }
