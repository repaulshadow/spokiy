name: Android screenshots

# Знімки екрана в емуляторі (Android 11 і 14) — кладуться в гілку screens-<API>.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 30, target: default }
          - { api: 34, target: google_apis }
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - run: SERVER_URL=http://10.0.2.2:8787 sh android/build_ci.sh $PWD/build/test.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout 900 python3 android/test/screens.py build/test.apk shots
      - name: Push screenshots
        if: always()
        run: |
          cd shots && git init -q -b screens && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screens api ${{ matrix.api }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens:screens-${{ matrix.api }}
