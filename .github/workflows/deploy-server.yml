name: Deploy server (Cloudflare)

# Запускается при изменении папки server/ или вручную:
# вкладка Actions -> "Deploy server (Cloudflare)" -> Run workflow.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml", "Trevoga.exe", "Trevoga.apk"]
  workflow_dispatch:

permissions:
  contents: write   # чтобы записать адрес сервера в config.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Не задан секрет CLOUDFLARE_API_TOKEN (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          if [ -z "$ALERTS_TOKEN" ]; then
            echo "::warning::Секрет ALERTS_TOKEN ещё не задан: сервер будет выложен, но данных о тревогах не будет, пока токен не добавите и не запустите workflow снова."
          fi

      - name: Prepare update files (version.json, exe, apk)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          root = ".."
          os.makedirs("public/download", exist_ok=True)
          def sha(p): return hashlib.sha256(open(p, "rb").read()).hexdigest()
          out = {}
          exe = os.path.join(root, "Trevoga.exe")
          if os.path.exists(exe):
              shutil.copy(exe, "public/download/Trevoga.exe")
              ver = re.search(r'AssemblyVersion\("([0-9.]+)"\)', open(os.path.join(root, "Trevoga.cs"), encoding="utf-8-sig").read()).group(1)
              out["windows"] = {"version": ver, "url": "/download/Trevoga.exe", "sha256": sha(exe), "size": os.path.getsize(exe)}
          apk = os.path.join(root, "Trevoga.apk")
          if os.path.exists(apk):
              shutil.copy(apk, "public/download/Trevoga.apk")
              man = open(os.path.join(root, "android/AndroidManifest.xml"), encoding="utf-8").read()
              code = int(re.search(r'android:versionCode="(\d+)"', man).group(1))
              name = re.search(r'android:versionName="([^"]+)"', man).group(1)
              out["android"] = {"code": code, "name": name, "url": "/download/Trevoga.apk", "sha256": sha(apk), "size": os.path.getsize(apk)}
          json.dump(out, open("public/version.json", "w"), indent=2)
          print("::notice title=version.json::" + json.dumps({k: {kk: v[kk] for kk in ("version", "code", "name") if kk in v} for k, v in out.items()}))
          PY

      - name: Deploy worker
        run: |
          npx --yes wrangler@4.145.0 deploy 2>&1 | tee deploy.log
          # коротко показываем итог выкладки в аннотациях запуска
          echo "::notice title=wrangler deploy::$(grep -vE '^\s*$' deploy.log | tail -n 12 | tr '\n' ' ' | cut -c1-900)"

      - name: Set alerts.in.ua token
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: |
          if [ -z "$ALERTS_TOKEN" ]; then echo "ALERTS_TOKEN не задан — пропускаю"; exit 0; fi
          printf '%s' "$ALERTS_TOKEN" | npx --yes wrangler@4.145.0 secret put ALERTS_TOKEN

      - name: Save server address to config.json
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            # спрашиваем поддомен workers.dev напрямую у Cloudflare
            acc=$(grep -oE '^account_id *= *"[0-9a-f]+"' wrangler.toml | grep -oE '[0-9a-f]{32}')
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$acc/workers/subdomain" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')" || true)
            if [ -n "$sub" ]; then url="https://trevoga.$sub.workers.dev"; fi
          fi
          if [ -z "$url" ]; then
            echo "::error::Сервер выложен, но у аккаунта Cloudflare нет адреса workers.dev. Откройте dash.cloudflare.com -> Workers & Pages, придумайте поддомен (Set up / Change subdomain) и снова запустите workflow."
            exit 1
          fi
          echo "Адрес сервера: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Проверка: $url/health" >> "$GITHUB_STEP_SUMMARY"
          cd ..
          printf '{\n  "server": "%s"\n}\n' "$url" > config.json
          if git diff --quiet config.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "Адрес сервера: $url"
          git push
