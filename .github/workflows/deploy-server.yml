name: Deploy server (Cloudflare)

# Запускается при изменении папки server/ или вручную:
# вкладка Actions -> "Deploy server (Cloudflare)" -> Run workflow.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

permissions:
  contents: write   # чтобы записать адрес сервера в config.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ALERTS_TOKEN" ] || missing="$missing ALERTS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Deploy worker
        run: npx --yes wrangler@4.145.0 deploy | tee deploy.log

      - name: Set alerts.in.ua token
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: printf '%s' "$ALERTS_TOKEN" | npx --yes wrangler@4.145.0 secret put ALERTS_TOKEN

      - name: Save server address to config.json
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::warning::Не удалось найти адрес сервера в выводе wrangler. Впишите его в config.json вручную."
            exit 0
          fi
          echo "Адрес сервера: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Проверка: $url/health" >> "$GITHUB_STEP_SUMMARY"
          cd ..
          printf '{\n  "server": "%s"\n}\n' "$url" > config.json
          if git diff --quiet config.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "Адрес сервера: $url"
          git push
