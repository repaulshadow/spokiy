name: Stream latency

# Слухає потік NEPTUN (як програма для Windows) і міряє затримку відносно офіційного часу.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Скільки хвилин слухати"
        default: "60"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
      MINUTES: ${{ inputs.minutes }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet websockets==12.0
      - run: python3 test/stream_latency.py
