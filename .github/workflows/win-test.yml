name: Windows app stream test

# Перевірка WebSocket-клієнта NEPTUN з Trevoga.cs під Mono (службове).
on:
  workflow_dispatch:
    inputs:
      seconds:
        default: "150"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-runtime libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil >/dev/null
      - name: Build
        run: mcs -nologo -langversion:6 -target:exe -main:Trevoga.StreamTest -r:System.Windows.Forms.dll -r:System.Drawing.dll -resource:config.json,config.json -out:st.exe Trevoga.cs test/StreamTest.cs
      - name: Run
        run: mono st.exe ${{ inputs.seconds }} "$(python3 -c 'import json;print(json.load(open("config.json"))["server"])')"
