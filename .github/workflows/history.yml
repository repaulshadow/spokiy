name: Alert history (alerts.in.ua)

# Історія тривог за останню добу з alerts.in.ua — для розбору затримок.
# Actions -> "Alert history (alerts.in.ua)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      oblast_uid:
        description: "UID області (18 = Одеська, 31 = м. Київ, 22 = Харківська ...)"
        default: "18"
      raion:
        description: "Фільтр за назвою (частина назви району/громади), можна порожньо"
        default: "Одеськ"
      hours:
        description: "За скільки годин"
        default: "24"
      tg:
        description: "Telegram-канал для порівняння (напр. tairoverada), можна порожньо"
        default: ""

jobs:
  history:
    runs-on: [self-hosted, trevoga]   # Mac користувача (хмарні хвилини GitHub не витрачаються)
    timeout-minutes: 5
    env:
      ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
      OBL: ${{ inputs.oblast_uid }}
      FLT: ${{ inputs.raion }}
      HOURS: ${{ inputs.hours }}
      TG: ${{ inputs.tg }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch history
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, datetime as dt
          url = f"https://api.alerts.in.ua/v1/regions/{os.environ['OBL']}/alerts/month_ago.json"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ALERTS_TOKEN"],
                                                     "User-Agent": "Trevoga-diag/1.0"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          since = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=int(os.environ["HOURS"]))
          kyiv = dt.timezone(dt.timedelta(hours=3))
          def t(s):
              if not s: return None
              return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))
          rows = []
          for a in data.get("alerts", []):
              st = t(a.get("started_at"))
              if not st or st < since: continue
              name = f"{a.get('location_title','')} ({a.get('location_type','')})"
              if os.environ["FLT"] and os.environ["FLT"].lower() not in (name + " " + str(a.get("location_raion",""))).lower():
                  continue
              fin = t(a.get("finished_at"))
              upd = t(a.get("updated_at"))
              rows.append((st, f"{name}: старт {st.astimezone(kyiv):%H:%M:%S}"
                                + (f", відбій {fin.astimezone(kyiv):%H:%M:%S}" if fin else ", триває")
                                + (f", оновлено {upd.astimezone(kyiv):%H:%M:%S}" if upd else "")
                                + f", рівень {a.get('alert_level')}, тип {a.get('alert_type')}, notes: {(a.get('notes') or '')[:80]}"))
          rows.sort()
          if not rows:
              print("::notice title=history::Нічого не знайдено")
          for _, line in rows[-40:]:
              print("::notice title=history (час київський)::" + line)
          EOF

      - name: Telegram post times
        if: ${{ inputs.tg != '' }}
        run: |
          python3 - <<'EOF'
          import os, re, urllib.request, datetime as dt, html
          ch = os.environ["TG"]
          page = urllib.request.urlopen(urllib.request.Request("https://t.me/s/" + ch, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
          kyiv = dt.timezone(dt.timedelta(hours=3))
          for m in re.finditer(r'data-post="([^"]+)".*?(?:tgme_widget_message_text[^>]*>(.*?)</div>).*?<time datetime="([^"]+)"', page, re.S):
              post, text, ts = m.group(1), m.group(2), m.group(3)
              t = dt.datetime.fromisoformat(ts).astimezone(kyiv)
              text = html.unescape(re.sub(r"<[^>]+>", " ", text)).strip()
              if "тривог" in text.lower() or "відбій" in text.lower():
                  print(f"::notice title=telegram (час київський)::{post}: {t:%d.%m %H:%M:%S} — {text[:90]}")
          EOF

      - name: Our server log
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse, datetime as dt
          server = json.load(open("config.json"))["server"]
          q = urllib.parse.quote(os.environ["FLT"])
          data = json.load(urllib.request.urlopen(server + "/log?q=" + q, timeout=30))
          kyiv = dt.timezone(dt.timedelta(hours=3))
          since = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=int(os.environ["HOURS"]))
          n = 0
          for e in data.get("events", []):
              t = dt.datetime.fromisoformat(e["t"].replace("Z", "+00:00"))
              if t < since: continue
              n += 1
              print(f"::notice title=наш сервер (час київський)::{t.astimezone(kyiv):%d.%m %H:%M:%S} — {e['src']}: {e['e']} — {e['k']}")
          if not n:
              print("::notice title=наш сервер::подій немає (журнал ведеться з моменту оновлення сервера)")
          EOF
